{{ define "main" }}
{{ with .Content }}<div>{{ . }}</div>{{ end }}
<h2>分类 / Categories</h2>
<div class="card-grid">
{{ range .Site.Sections }}<a class="card" href="{{ .RelPermalink }}"><h3>{{ .Title }}</h3></a>{{ end }}
</div>
<h2>最新 / Latest</h2>
<div class="card-grid">
{{ range first 10 .Site.RegularPages }}<a class="card" href="{{ .RelPermalink }}"><h3>{{ .Title }}</h3>{{ with .Description }}<p>{{ . }}</p>{{ end }}</a>{{ end }}
</div>
{{ end }}
